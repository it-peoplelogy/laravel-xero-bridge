name: run-tests

# Named branches on push, plus every pull request. The skeleton's version
# fires on every feature branch, which burns ten jobs a push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# A NOTE ON LARAVEL 11, which explains the continue-on-error below.
#
# Laravel 11 reached end of SECURITY support on 12 March 2026. Three advisories
# affect the whole 11.x line -- including CVE-2026-48019, a high-severity CRLF
# injection in the default email validation rule -- and they are fixed only in
# 12.60.0 / 12.61.1 / 13.10.0 / 13.12.0. They will never be backported, so
# Composer now refuses to install Laravel 11 under its default advisory policy.
#
# The package still SUPPORTS Laravel 11 (illuminate/contracts ^11.0||^12.0||^13.0)
# because the first consumer, PIPS, runs it. But an EOL framework must not be
# able to redden this build, and it must not be silently certified either. So
# the Laravel 11 legs run with advisory blocking off AND continue-on-error:
# their result stays visible without gating the branch.
#
# Remove the Laravel 11 rows entirely once PIPS is on Laravel 12 or 13.
# ---------------------------------------------------------------------------

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Laravel 11 is best-effort only; 12 and 13 gate the build as normal.
    continue-on-error: ${{ matrix.laravel == '11.*' }}

    strategy:
      # false, not true: when one leg breaks we need to know whether the others
      # broke with it. That distinction IS the diagnosis.
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          # The Testbench major is a hard function of the Laravel major.
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # IMPOSSIBLE, not merely skipped: laravel/framework v13 declares
          # "php": "^8.3" and orchestra/testbench v11 declares the same,
          # independently. No version of either runs on 8.2.
          - php: '8.2'
            laravel: '13.*'

    # 3 x 3 - 1 = 8 jobs.
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.laravel == '11.*' && ' (EOL, best-effort)' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Trimmed from the skeleton's list: an HTTP API wrapper needs none
          # of soap/gd/exif/imagick, and imagick alone costs ~40s per job.
          # pdo_sqlite and sqlite ARE load-bearing -- the whole suite runs on
          # in-memory sqlite.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
          ini-values: memory_limit=512M

      - name: Validate composer.json
        # Runs BEFORE the matrix pins below mutate it, so it checks what was
        # actually committed.
        run: composer validate --strict --no-check-lock

      - name: Guard against committed credentials
        # Cheap, and the one class of mistake that cannot be un-made once
        # pushed. A Xero client id is 32 uppercase hex characters.
        run: |
          ! grep -rInE '[A-F0-9]{32}|Bearer [A-Za-z0-9._-]{40,}' \
              --include='*.php' --include='*.json' --include='*.md' --include='*.yml' \
              src/ tests/ config/ README.md

      - name: Allow the EOL Laravel 11 line to install
        if: matrix.laravel == '11.*'
        # See the note at the top of this file. Scoped to this leg only --
        # Laravel 12 and 13 keep full advisory blocking, so a genuine new
        # advisory in a supported dependency still fails the build.
        run: composer config policy.advisories.block false

      - name: Pin the Laravel and Testbench majors for this leg
        # Without this, a PHP 8.2 runner always resolves the HIGHEST
        # installable Testbench and the Laravel 11 column would never actually
        # be tested. --dev keeps laravel/framework out of the package's own
        # `require`, where it does not belong.
        run: >
          composer require --dev
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --no-interaction --no-update

      - name: Install dependencies
        env:
          # Resolving three floating Pest majors against three Laravel majors
          # exceeds the default limit.
          COMPOSER_MEMORY_LIMIT: -1
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Show what actually resolved
        # The single most useful line in this log. Expect Pest 3 on the 8.2
        # legs, Pest 4 on 8.3/8.4 with Laravel 11 or 12, and Pest 5 ONLY on
        # 8.4 + Laravel 13 -- Pest 5 needs symfony/process ^8.1, which
        # Laravel 11 and 12 both forbid.
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/pest --ci

  lowest:
    # --prefer-lowest at the floor of the SUPPORTED window. This is the leg
    # that catches an under-constrained `require` -- for example the
    # skeleton's default spatie/laravel-package-tools:^1.16, whose lowest
    # member cannot support Laravel 13 at all.
    #
    # A separate job rather than a matrix dimension: it only ever re-proves
    # the floor, so running it on every cell would multiply CI time for one
    # bit of information.
    name: Lowest deps (PHP 8.2 / Laravel 12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
          ini-values: memory_limit=512M

      - run: >
          composer require --dev "laravel/framework:12.*" "orchestra/testbench:10.*"
          --no-interaction --no-update

      - env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - run: composer show --direct

      - run: vendor/bin/pest --ci

  lowest-eol:
    # The same check at the floor of the BEST-EFFORT window, and the only leg
    # anywhere that exercises Carbon 2: Laravel 11 allows
    # `nesbot/carbon ^2.72.6|^3.8.4`, while Laravel 12 and 13 both require ^3.8.4.
    #
    # That matters, because Carbon 2 keeps separate test-now state for Carbon
    # and CarbonImmutable -- which is how the package's clock bug slipped past
    # every other leg. Non-blocking, for the EOL reasons at the top of the file.
    name: Lowest deps (PHP 8.2 / Laravel 11, EOL, best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
          ini-values: memory_limit=512M

      - run: composer config policy.advisories.block false

      - run: >
          composer require --dev "laravel/framework:11.*" "orchestra/testbench:9.*"
          --no-interaction --no-update

      - env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - run: composer show --direct

      - run: vendor/bin/pest --ci

  coverage:
    # CI-only: there is no Xdebug or PCOV on the development machine, so
    # `composer test-coverage` cannot run locally at all. Gated behind the
    # matrix so it does not run on an already-red branch.
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov
          ini-values: memory_limit=512M

      - env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest --ci --coverage --min=80
